<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#222">
  <!-- P(Wake) / P(Doze): the paper (Wiggin et al. 2020, Fig. 1A) next to FSLRetho -->
  <defs>
    <marker id="ah-doze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a9850"/></marker>
    <marker id="ah-wake" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d73027"/></marker>
    <marker id="ah-off" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#aaa"/></marker>
  </defs>
  <rect width="1120" height="560" fill="#fff"/>

  <!-- ===== Legend ===== -->
  <g transform="translate(200,14)">
    <text x="0" y="17">Active minute:</text><rect x="96" y="3" width="20" height="20" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="160" y="17">Inactive minute:</text><rect x="265" y="3" width="20" height="20" fill="#222" stroke="#222" stroke-width="2"/>
    <text x="335" y="17" fill="#1a9850" font-weight="bold">Doze</text>
    <text x="370" y="17">(active → inactive, arrow above)</text>
    <text x="590" y="17" fill="#d73027" font-weight="bold">Wake</text>
    <text x="628" y="17">(inactive → active, arrow below)</text>
  </g>
  <line x1="560" y1="62" x2="560" y2="548" stroke="#ccc" stroke-width="1.5"/>

  <!-- ===== LEFT: the paper ===== -->
  <text x="280" y="80" text-anchor="middle" font-size="17" font-weight="bold">Wiggin et al. 2020 (Fig. 1A, Example #1)</text>
  <text x="57" y="112" fill="#555">DAM: a minute is active if the fly crossed the beam at least once</text>
  <rect x="57" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/><rect x="103" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="149" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="195" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="241" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/>
  <rect x="287" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="333" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="379" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="425" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/><rect x="471" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/>
  <g fill="none" stroke-width="2">
    <path d="M73,186 Q96,158 119,186" stroke="#1a9850" marker-end="url(#ah-doze)"/>
    <path d="M257,186 Q280,158 303,186" stroke="#1a9850" marker-end="url(#ah-doze)"/>
    <path d="M211,226 Q234,254 257,226" stroke="#d73027" marker-end="url(#ah-wake)"/>
    <path d="M395,226 Q418,254 441,226" stroke="#d73027" marker-end="url(#ah-wake)"/>
  </g>
  <path d="M57,256 v6 H503 v-6" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="280" y="280" text-anchor="middle" fill="#555">the whole sequence</text>

  <g transform="translate(0,310)">
    <text x="300" y="0" text-anchor="middle" font-weight="bold" fill="#1a9850">P(Doze)</text>
    <text x="440" y="0" text-anchor="middle" font-weight="bold" fill="#d73027">P(Wake)</text>
    <line x1="57" y1="8" x2="503" y2="8" stroke="#ddd"/>
    <text x="57" y="28">whole sequence</text>
    <text x="300" y="28" text-anchor="middle">2/3 = 0.67</text>
    <text x="440" y="28" text-anchor="middle">2/6 = 0.33</text>
  </g>

  <g transform="translate(57,400)" fill="#333">
    <text y="0">Every minute that has a next minute is an opportunity:</text>
    <text y="22"><tspan fill="#1a9850" font-weight="bold">P(Doze)</tspan> = doze arrows / active minutes</text>
    <text y="42"><tspan fill="#d73027" font-weight="bold">P(Wake)</tspan> = wake arrows / inactive minutes</text>
    <text y="64">The last minute has no next minute, so it is not counted</text>
    <text y="82">(2/3, not 2/4).</text>
    <text y="104">Every value is kept, even one based on a single minute.</text>
  </g>

  <!-- ===== RIGHT: FSLRetho ===== -->
  <text x="840" y="80" text-anchor="middle" font-size="17" font-weight="bold">FSLRetho</text>
  <circle cx="617" cy="108" r="9" fill="#e67e22"/><text x="617" y="112.5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">1</text>
  <text x="632" y="112" fill="#555">Ethoscope: six 10 s windows per minute (□ = moving)</text>
  <!-- 10 s windows: x_box + j*5.4 -->
  <g id="win">
    <!-- min 1: moving in windows 1,2 -->
    <g transform="translate(607,132)"><rect x="0" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(653,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(699,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(745,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <!-- min 5: a single moving window is enough -->
    <g transform="translate(791,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(857,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(903,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(949,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(995,132)"><rect x="0" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
    <g transform="translate(1041,132)"><rect x="0" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="5.4" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="10.8" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="16.2" width="5" height="11" fill="#fff" stroke="#222" stroke-width="0.8"/><rect x="21.6" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/><rect x="27" width="5" height="11" fill="#222" stroke="#222" stroke-width="0.8"/></g>
  </g>
  <rect x="607" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/><rect x="653" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="699" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="745" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="791" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/>
  <rect x="857" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="903" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="949" y="190" width="32" height="32" fill="#222" stroke="#222" stroke-width="2"/><rect x="995" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/><rect x="1041" y="190" width="32" height="32" fill="#fff" stroke="#222" stroke-width="2"/>
  <!-- bin edge -->
  <line x1="840" y1="124" x2="840" y2="268" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,4"/>
  <g fill="none" stroke-width="2">
    <path d="M623,186 Q646,158 669,186" stroke="#1a9850" marker-end="url(#ah-doze)"/>
    <path d="M761,226 Q784,254 807,226" stroke="#d73027" marker-end="url(#ah-wake)"/>
    <path d="M965,226 Q988,254 1011,226" stroke="#d73027" marker-end="url(#ah-wake)"/>
    <!-- crosses the bin edge: not counted -->
    <path d="M807,186 Q840,156 873,186" stroke="#aaa" stroke-dasharray="4,3" marker-end="url(#ah-off)"/>
  </g>
  <g stroke="#e67e22" stroke-width="2.5"><line x1="834" y1="165" x2="846" y2="177"/><line x1="846" y1="165" x2="834" y2="177"/></g>
  <circle cx="862" cy="160" r="9" fill="#e67e22"/><text x="862" y="164.5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">2</text>
  <path d="M607,256 v6 H823 v-6" fill="none" stroke="#888" stroke-width="1.5"/>
  <path d="M857,256 v6 H1073 v-6" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="715" y="280" text-anchor="middle" fill="#555">bin 1</text>
  <text x="965" y="280" text-anchor="middle" fill="#555">bin 2</text>

  <g transform="translate(0,310)">
    <text x="850" y="0" text-anchor="middle" font-weight="bold" fill="#1a9850">P(Doze)</text>
    <text x="1010" y="0" text-anchor="middle" font-weight="bold" fill="#d73027">P(Wake)</text>
    <line x1="607" y1="8" x2="1073" y2="8" stroke="#ddd"/>
    <text x="607" y="28">bin 1</text>
    <text x="850" y="28" text-anchor="middle">1/1 → <tspan font-weight="bold" fill="#e67e22">NA</tspan></text>
    <text x="1010" y="28" text-anchor="middle">1/3 = 0.33</text>
    <text x="607" y="50">bin 2</text>
    <text x="850" y="50" text-anchor="middle">0/1 → <tspan font-weight="bold" fill="#e67e22">NA</tspan></text>
    <text x="1010" y="50" text-anchor="middle">1/3 = 0.33</text>
    <circle cx="905" cy="38" r="9" fill="#e67e22"/><text x="905" y="42.5" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">3</text>
  </g>

  <g transform="translate(607,400)" fill="#333">
    <text y="0">Same formula as the paper, with three differences:</text>
    <g transform="translate(0,22)">
      <circle cx="9" cy="-4.5" r="9" fill="#e67e22"/><text x="9" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">1</text>
      <text x="26" y="0">Ethoscope: a minute is active if any 10 s window moved.</text>
      <text x="26" y="17">DAM: any beam cross, as in the paper.</text>
    </g>
    <g transform="translate(0,62)">
      <circle cx="9" cy="-4.5" r="9" fill="#e67e22"/><text x="9" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">2</text>
      <text x="26" y="0">Computed in each bin (here 5 min, default 30 min) and</text>
      <text x="26" y="17">for the default and SD intervals separately: a transition</text>
      <text x="26" y="34">across a bin edge is not counted.</text>
    </g>
    <g transform="translate(0,119)">
      <circle cx="9" cy="-4.5" r="9" fill="#e67e22"/><text x="9" y="0" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">3</text>
      <text x="26" y="0">Fewer minutes in the starting state than the minimum</text>
      <text x="26" y="17">(here 3, default 5) → NA. Set it to 0 to keep every value.</text>
    </g>
  </g>
</svg>
